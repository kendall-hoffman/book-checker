name: Check library availability

on:
  workflow_dispatch:
    inputs:
      verify:
        description: "Only verify library addresses"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify library addresses
        if: ${{ inputs.verify }}
        run: python check_books.py --verify
      - name: Check books
        if: ${{ !inputs.verify }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_books.py
      - name: Save results
        if: ${{ !inputs.verify }}
        run: |
          git config user.name "book-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json docs/data.json
          git diff --staged --quiet || git commit -m "Update availability"
          git push
